    <linearGradient id="blkTop" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B9B0DD"/><stop offset="1" stop-color="#A69BD3"/></linearGradient>
  </defs>

  <rect width="1200" height="800" fill="#FFFFFF"/>

  <!-- ============ 左侧色带标签 ============ -->
  <rect x="0" y="0" width="46" height="262" fill="#2E6DA4"/>
  <rect x="0" y="262" width="46" height="292" fill="#5B4E9A"/>
  <rect x="0" y="554" width="46" height="246" fill="#2F7A86"/>
  <g fill="#FFFFFF" font-size="21" font-weight="600" text-anchor="middle">
    <text transform="translate(31 131) rotate(-90)">Study design</text>
    <text transform="translate(31 408) rotate(-90)">Model</text>
    <text transform="translate(31 677) rotate(-90)">Findings</text>
  </g>
  <rect x="46" y="0" width="1154" height="262" fill="#F4F6F9"/>
  <rect x="46" y="554" width="1154" height="246" fill="#F4F6F9"/>
  <g stroke="#2B2B2B" stroke-width="2"><line x1="0" y1="262" x2="1200" y2="262"/><line x1="0" y1="554" x2="1200" y2="554"/></g>
  <rect x="1" y="1" width="1198" height="798" fill="none" stroke="#2B2B2B" stroke-width="2"/>

  <!-- ============ 1 研究设计 ============ -->
  <text x="86" y="44" font-size="25" fill="#1F2937">Resting-state EEG cohort</text>
  <!-- 人群 -->
  <g>
    <circle cx="208" cy="148" r="86" fill="#FFFFFF" stroke="#C9D3E0" stroke-width="2"/>
    <use href="#person" x="128" y="96" width="44" height="76" fill="#E58FA6"/>
    <use href="#person" x="178" y="88" width="44" height="76" fill="#3F78B8"/>
    <use href="#person" x="228" y="96" width="44" height="76" fill="#2D4E7E"/>
    <use href="#person" x="150" y="150" width="44" height="76" fill="#5E9BD6"/>
    <use href="#person" x="204" y="152" width="44" height="76" fill="#C86A86"/>
    <use href="#person" x="256" y="146" width="44" height="76" fill="#7BA7D9"/>
  </g>
  <text x="208" y="256" text-anchor="middle" font-size="15" fill="#4B5563">across the cognitive spectrum</text>
  <g transform="translate(306 96)">
    <text x="0" y="0" font-size="34" font-weight="800" fill="#2E6DA4">743</text>
    <text x="0" y="22" font-size="15" fill="#4B5563">participants</text>
  </g>

  <path d="M312 170 L392 170" stroke="#2B2B2B" stroke-width="2.4" fill="none" marker-end="url(#ah)"/>

  <!-- 戴脑电帽的头 -->
  <g transform="translate(404 66) scale(0.45)">
    <path d="M120 400 C120 345 108 318 94 292 C70 250 64 198 80 158 C100 100 160 62 226 62 C292 62 336 106 343 160 C346 180 345 194 351 207 C359 221 373 235 377 247 C379 254 372 258 362 260 C365 268 366 274 360 278 C364 285 362 292 354 296 C351 312 343 322 325 324 C305 326 290 326 284 332 L280 400 Z" fill="url(#skin)" stroke="#B98A74" stroke-width="3"/>
    <path d="M78 176 C86 104 150 52 226 52 C300 52 346 102 352 170 C300 150 150 146 78 176 Z" fill="url(#cap)" stroke="#2F5A8E" stroke-width="3"/>
    <path d="M96 178 C110 230 150 262 190 282" fill="none" stroke="#3E6BA6" stroke-width="6" stroke-linecap="round"/>
    <g fill="#F5F7FA" stroke="#24456F" stroke-width="4">
