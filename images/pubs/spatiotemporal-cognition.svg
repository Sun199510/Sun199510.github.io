      <circle cx="0" cy="-33" r="13"/>
      <path d="M-19 26 L-19 -4 Q-19 -17 -6 -17 L6 -17 Q19 -17 19 -4 L19 26 Z"/>
    </symbol>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBE3D6"/><stop offset="1" stop-color="#EFC4AE"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5D8CC7"/><stop offset="1" stop-color="#3E6BA6"/>
    </linearGradient>
    <radialGradient id="hot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D9534F" stop-opacity="0.95"/><stop offset="1" stop-color="#D9534F" stop-opacity="0"/>
