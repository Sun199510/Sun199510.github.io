      <circle cx="282" cy="96" r="11"/><circle cx="322" cy="134" r="11"/><circle cx="176" cy="140" r="11"/>
      <circle cx="232" cy="128" r="11"/><circle cx="284" cy="146" r="11"/>
    </g>
    <path d="M226 52 C230 20 260 4 300 6" fill="none" stroke="#6B7280" stroke-width="6"/>
  </g>
  <text x="488" y="256" text-anchor="middle" font-size="15" fill="#4B5563">resting-state EEG</text>

  <!-- 多通道脑电 -->
  <g transform="translate(600 72)">
    <rect x="0" y="0" width="220" height="160" rx="10" fill="#FFFFFF" stroke="#C9D3E0" stroke-width="2"/>
    <g fill="none" stroke-width="1.8" stroke-linejoin="round">
      <path stroke="#2E6DA4" d="M14 26 l8 -6 l8 9 l8 -12 l8 10 l8 -5 l8 8 l8 -9 l8 6 l8 -4 l8 7 l8 -10 l8 8 l8 -3 l8 6 l8 -8 l8 7 l8 -4 l8 3 l8 -5 l8 4 l8 -2 l8 2"/>
      <path stroke="#5B4E9A" d="M14 56 l8 5 l8 -9 l8 11 l8 -7 l8 8 l8 -12 l8 9 l8 -4 l8 6 l8 -8 l8 5 l8 -3 l8 7 l8 -6 l8 4 l8 -7 l8 9 l8 -4 l8 2 l8 -3 l8 4 l8 -1"/>
      <path stroke="#2F7A86" d="M14 86 l8 -8 l8 6 l8 -4 l8 11 l8 -9 l8 6 l8 -3 l8 8 l8 -10 l8 7 l8 -5 l8 9 l8 -6 l8 4 l8 -7 l8 5 l8 -3 l8 6 l8 -4 l8 3 l8 -2 l8 1"/>
      <path stroke="#C86A86" d="M14 116 l8 6 l8 -10 l8 7 l8 -5 l8 9 l8 -7 l8 4 l8 -9 l8 8 l8 -3 l8 6 l8 -8 l8 5 l8 -4 l8 7 l8 -6 l8 3 l8 -2 l8 5 l8 -3 l8 2 l8 -1"/>
      <path stroke="#7BA7D9" d="M14 144 l8 -5 l8 8 l8 -6 l8 4 l8 -9 l8 7 l8 -3 l8 6 l8 -5 l8 8 l8 -7 l8 3 l8 -4 l8 6 l8 -2 l8 4 l8 -6 l8 3 l8 -2 l8 3 l8 -1 l8 1"/>
    </g>
  </g>
  <text x="710" y="256" text-anchor="middle" font-size="15" fill="#4B5563">multichannel recordings</text>

  <!-- 括号 + 量表 -->
  <path d="M842 76 L856 76 L856 228 L842 228 M856 152 L880 152" fill="none" stroke="#2B2B2B" stroke-width="2"/>
  <g transform="translate(900 66)">
    <rect x="0" y="12" width="120" height="156" rx="10" fill="#FFFFFF" stroke="#8C99AA" stroke-width="2.4"/>
    <rect x="36" y="0" width="48" height="22" rx="6" fill="#8C99AA"/>
    <g stroke="#C9D3E0" stroke-width="5" stroke-linecap="round">
      <line x1="40" y1="50" x2="100" y2="50"/><line x1="40" y1="78" x2="100" y2="78"/><line x1="40" y1="106" x2="88" y2="106"/><line x1="40" y1="134" x2="96" y2="134"/>
    </g>
    <g fill="none" stroke="#2F7A86" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 50 l6 6 l10 -12"/><path d="M16 78 l6 6 l10 -12"/><path d="M16 134 l6 6 l10 -12"/>
    </g>
    <rect x="15" y="98" width="16" height="16" rx="3" fill="none" stroke="#9AA3AE" stroke-width="2.4"/>
  </g>
  <text x="960" y="256" text-anchor="middle" font-size="15" fill="#4B5563">clinical cognitive scale</text>
  <text x="1060" y="128" font-size="15" fill="#4B5563">score</text>
  <text x="1060" y="148" font-size="15" fill="#4B5563">labels</text>
  <text x="1060" y="168" font-size="15" fill="#4B5563">(0–100%)</text>

  <!-- ============ 2 模型 ============ -->
  <text x="86" y="304" font-size="25" fill="#1F2937">Adaptive spatiotemporal encoding network</text>

