    <radialGradient id="cold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3F6FB5" stop-opacity="0.9"/><stop offset="1" stop-color="#3F6FB5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F0B35A" stop-opacity="0.9"/><stop offset="1" stop-color="#F0B35A" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="scalp"><circle cx="0" cy="0" r="62"/></clipPath>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
