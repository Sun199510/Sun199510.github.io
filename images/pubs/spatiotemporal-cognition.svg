    <ellipse cx="-64" cy="0" rx="7" ry="16" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
    <ellipse cx="64" cy="0" rx="7" ry="16" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
    <circle r="62" fill="#EEF1F6"/>
    <g clip-path="url(#scalp)">
      <circle cx="-22" cy="30" r="52" fill="url(#hot)"/>
      <circle cx="30" cy="-28" r="50" fill="url(#cold)"/>
      <circle cx="34" cy="34" r="36" fill="url(#warm)"/>
      <circle cx="-34" cy="-30" r="30" fill="url(#warm)"/>
    </g>
    <circle r="62" fill="none" stroke="#6B7280" stroke-width="2"/>
    <g fill="#2B2B2B">
      <circle cx="-20" cy="-42" r="3"/><circle cx="20" cy="-42" r="3"/><circle cx="-40" cy="-14" r="3"/><circle cx="0" cy="-18" r="3"/><circle cx="40" cy="-14" r="3"/>
      <circle cx="-46" cy="14" r="3"/><circle cx="-16" cy="10" r="3"/><circle cx="16" cy="10" r="3"/><circle cx="46" cy="14" r="3"/>
      <circle cx="-28" cy="38" r="3"/><circle cx="0" cy="34" r="3"/><circle cx="28" cy="38" r="3"/><circle cx="0" cy="52" r="3"/>
    </g>
  </g>
  <text x="160" y="532" text-anchor="middle" font-size="16" fill="#374151">EEG topography</text>

