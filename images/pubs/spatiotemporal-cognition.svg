    <g stroke="#5B4E9A" stroke-linecap="round" fill="none">
      <line x1="-50" y1="-40" x2="10" y2="-58" stroke-width="5" stroke-opacity="0.85"/>
      <line x1="10" y1="-58" x2="56" y2="-20" stroke-width="2" stroke-opacity="0.5"/>
      <line x1="-50" y1="-40" x2="-4" y2="0" stroke-width="3" stroke-opacity="0.6"/>
      <line x1="-4" y1="0" x2="56" y2="-20" stroke-width="6" stroke-opacity="0.9"/>
      <line x1="-4" y1="0" x2="-58" y2="28" stroke-width="2" stroke-opacity="0.45"/>
      <line x1="-58" y1="28" x2="-10" y2="58" stroke-width="4" stroke-opacity="0.75"/>
      <line x1="-10" y1="58" x2="48" y2="38" stroke-width="2.5" stroke-opacity="0.55"/>
      <line x1="48" y1="38" x2="56" y2="-20" stroke-width="3.5" stroke-opacity="0.7"/>
      <line x1="-4" y1="0" x2="48" y2="38" stroke-width="5" stroke-opacity="0.85"/>
      <line x1="10" y1="-58" x2="-4" y2="0" stroke-width="1.8" stroke-opacity="0.4"/>
    </g>
    <g stroke="#FFFFFF" stroke-width="3">
      <circle cx="-50" cy="-40" r="11" fill="#7E70BF"/><circle cx="10" cy="-58" r="11" fill="#7E70BF"/>
      <circle cx="56" cy="-20" r="11" fill="#7E70BF"/><circle cx="-4" cy="0" r="14" fill="#4A3D8A"/>
      <circle cx="-58" cy="28" r="11" fill="#7E70BF"/><circle cx="-10" cy="58" r="11" fill="#7E70BF"/>
      <circle cx="48" cy="38" r="11" fill="#7E70BF"/>
    </g>
  </g>
  <text x="400" y="532" text-anchor="middle" font-size="16" fill="#374151">adaptive spatial graph</text>

  <path d="M500 430 L556 430" stroke="#2B2B2B" stroke-width="2.4" marker-end="url(#ah)"/>

  <!-- 时间编码：叠放的块 -->
  <g transform="translate(574 330) scale(0.95)">
    <g>
      <path d="M0 40 L130 40 L130 150 L0 150 Z" fill="#8F84C8"/>
      <path d="M0 40 L24 20 L154 20 L130 40 Z" fill="url(#blkTop)"/>
      <path d="M130 40 L154 20 L154 130 L130 150 Z" fill="#6E62AE"/>
      <path d="M12 96 C24 70 36 70 48 96 C60 122 72 122 84 96 C96 70 108 70 120 96" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    </g>
    <g transform="translate(32 26)">
      <path d="M0 40 L130 40 L130 150 L0 150 Z" fill="#A89FD6"/>
      <path d="M0 40 L24 20 L154 20 L130 40 Z" fill="#C6BFE6"/>
      <path d="M130 40 L154 20 L154 130 L130 150 Z" fill="#8579C0"/>
      <path d="M12 96 C20 76 28 76 36 96 C44 116 52 116 60 96 C68 76 76 76 84 96 C92 116 100 116 108 96 C114 82 118 82 122 90" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    </g>
  </g>
  <text x="664" y="532" text-anchor="middle" font-size="16" fill="#374151">temporal encoder</text>

  <path d="M786 430 L842 430" stroke="#2B2B2B" stroke-width="2.4" marker-end="url(#ah)"/>

  <!-- 融合 -->
  <g transform="translate(860 370)">
    <rect x="0" y="0" width="34" height="120" rx="8" fill="#5B4E9A"/>
    <rect x="44" y="20" width="34" height="80" rx="8" fill="#7E70BF"/>
    <g fill="#FFFFFF"><circle cx="17" cy="22" r="5"/><circle cx="17" cy="46" r="5"/><circle cx="17" cy="70" r="5"/><circle cx="17" cy="94" r="5"/><circle cx="61" cy="44" r="5"/><circle cx="61" cy="76" r="5"/></g>
  </g>
  <text x="899" y="532" text-anchor="middle" font-size="16" fill="#374151">fusion</text>

  <path d="M950 430 L990 430" stroke="#2B2B2B" stroke-width="2.4" marker-end="url(#ah)"/>

  <!-- 分数仪表 -->
  <g transform="translate(1086 450)">
    <path d="M-80 0 A80 80 0 0 1 80 0" fill="none" stroke="#E5E7EB" stroke-width="20"/>
    <path d="M-80 0 A80 80 0 0 1 -40 -69.3" fill="none" stroke="#D9534F" stroke-width="20"/>
    <path d="M-40 -69.3 A80 80 0 0 1 40 -69.3" fill="none" stroke="#F0B35A" stroke-width="20"/>
    <path d="M40 -69.3 A80 80 0 0 1 80 0" fill="none" stroke="#3E9C7F" stroke-width="20"/>
    <line x1="0" y1="0" x2="40" y2="-56" stroke="#2B2B2B" stroke-width="5" stroke-linecap="round"/>
    <circle r="9" fill="#2B2B2B"/>
    <text x="0" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1F2937">78%</text>
  </g>
  <text x="1086" y="532" text-anchor="middle" font-size="16" fill="#374151">continuous cognitive score</text>

  <!-- ============ 3 结果 ============ -->
  <text x="86" y="596" font-size="23" fill="#1F2937">Accurate score estimation</text>
  <line x1="86" y1="608" x2="520" y2="608" stroke="#2B2B2B" stroke-width="1.6"/>
  <!-- 散点图 -->
  <g transform="translate(110 622) scale(0.93)">
    <line x1="0" y1="150" x2="190" y2="150" stroke="#2B2B2B" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="150" stroke="#2B2B2B" stroke-width="2"/>
    <line x1="0" y1="150" x2="180" y2="0" stroke="#9AA3AE" stroke-width="2" stroke-dasharray="6 5"/>
    <g fill="#2F7A86" fill-opacity="0.7">
      <circle cx="18" cy="130" r="5"/><circle cx="26" cy="122" r="5"/><circle cx="34" cy="126" r="5"/><circle cx="44" cy="112" r="5"/>
      <circle cx="52" cy="104" r="5"/><circle cx="60" cy="102" r="5"/><circle cx="70" cy="90" r="5"/><circle cx="78" cy="88" r="5"/>
      <circle cx="86" cy="80" r="5"/><circle cx="94" cy="72" r="5"/><circle cx="102" cy="68" r="5"/><circle cx="110" cy="60" r="5"/>
      <circle cx="118" cy="54" r="5"/><circle cx="126" cy="46" r="5"/><circle cx="134" cy="42" r="5"/><circle cx="142" cy="34" r="5"/>
      <circle cx="150" cy="28" r="5"/><circle cx="160" cy="22" r="5"/><circle cx="168" cy="14" r="5"/><circle cx="64" cy="96" r="5"/>
      <circle cx="98" cy="74" r="5"/><circle cx="130" cy="48" r="5"/><circle cx="40" cy="120" r="5"/>
    </g>
    <text x="95" y="172" text-anchor="middle" font-size="13" fill="#4B5563">clinical score</text>
    <text transform="translate(-14 75) rotate(-90)" text-anchor="middle" font-size="13" fill="#4B5563">predicted</text>
  </g>
  <g transform="translate(330 646)">
    <text x="0" y="40" font-size="46" font-weight="800" fill="#2F7A86">3.12%</text>
    <text x="2" y="66" font-size="16" fill="#374151">mean absolute error</text>
    <text x="2" y="90" font-size="14" fill="#6B7280">on held-out participants</text>
  </g>

  <line x1="584" y1="580" x2="584" y2="782" stroke="#C9D3E0" stroke-width="2"/>

  <text x="624" y="596" font-size="23" fill="#1F2937">Implication</text>
  <line x1="624" y1="608" x2="1170" y2="608" stroke="#2B2B2B" stroke-width="1.6"/>
  <!-- 居家筛查场景：戴头带的人 + 笔记本 -->
  <g transform="translate(640 628)">
    <use href="#person" x="20" y="34" width="70" height="121" fill="#5E9BD6"/>
    <path d="M37 46 C42 26 68 26 73 46" fill="none" stroke="#2B2B2B" stroke-width="5" stroke-linecap="round"/>
    <circle cx="40" cy="44" r="4.5" fill="#2F7A86"/><circle cx="70" cy="44" r="4.5" fill="#2F7A86"/><circle cx="55" cy="30" r="4.5" fill="#2F7A86"/>
    <rect x="104" y="80" width="96" height="64" rx="6" fill="#FFFFFF" stroke="#4B5563" stroke-width="3"/>
    <path d="M94 150 L210 150 L202 158 L102 158 Z" fill="#4B5563"/>
    <path d="M116 126 L136 112 L154 118 L174 98 L190 104" fill="none" stroke="#2F7A86" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="190" cy="104" r="4" fill="#D9534F"/>
  </g>
  <g transform="translate(872 640)" font-size="17" fill="#1F2937">
    <g fill="none" stroke="#2F7A86" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 10 l6 6 l11 -13"/><path d="M0 56 l6 6 l11 -13"/><path d="M0 102 l6 6 l11 -13"/>
    </g>
    <text x="28" y="16">Low-cost cognitive screening</text>
    <text x="28" y="62">Fits routine resting EEG,</text>
    <text x="28" y="82" fill="#4B5563" font-size="15">no task or patient cooperation</text>
    <text x="28" y="108">Repeatable for long-term</text>
    <text x="28" y="128" fill="#4B5563" font-size="15">monitoring of cognitive change</text>
  </g>
</svg>
