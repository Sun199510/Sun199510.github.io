  <text x="600" y="99" text-anchor="middle" font-size="19" fill="#3D3420">Can cognition be assessed while people simply watch a short video?</text>

  <!-- ===== PASSIVE RECORDING ===== -->
  <rect x="28" y="146" width="612" height="632" rx="18" fill="#FCF5F1" stroke="#C9785A" stroke-width="2.5"/>
  <rect x="210" y="130" width="248" height="36" rx="8" fill="#B5603F"/>
