  <rect width="1200" height="800" fill="#FFFFFF"/>

  <!-- title + question -->
  <text x="600" y="50" text-anchor="middle" font-size="30" font-weight="700" fill="#3A2A22">EasyCog: cognitive assessment from passive video watching</text>
