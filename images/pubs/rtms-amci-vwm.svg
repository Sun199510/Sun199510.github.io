      <circle cx="-22" cy="30" r="2.6"/><circle cx="0" cy="28" r="2.6"/><circle cx="22" cy="30" r="2.6"/><circle cx="0" cy="42" r="2.6"/>
    </g>
  </g>
  <text x="811" y="472" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2937">parieto-occipital α ↑</text>

