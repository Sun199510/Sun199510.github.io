  <text x="980" y="204" font-size="16" font-weight="700" fill="#A8466A">aMCI deficit</text>
  <text x="980" y="226" font-size="15" fill="#374151">N2pc, α and θ</text>
  <text x="980" y="246" font-size="15" fill="#374151">reduced at encoding</text>

