    <radialGradient id="roseWarm" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#E8A6B9" stop-opacity="0.9"/><stop offset="1" stop-color="#E8A6B9" stop-opacity="0"/></radialGradient>
