  <rect width="1200" height="800" fill="#FFFFFF"/>

  <!-- ===== 标题 + 问题 ===== -->
  <text x="600" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#1F3A68">High-frequency rTMS improves visual working memory in aMCI</text>
  <rect x="200" y="68" width="800" height="44" rx="10" fill="#FDF0C2" stroke="#E2BC52" stroke-width="2"/>
  <text x="600" y="97" text-anchor="middle" font-size="19" fill="#3D3420">Which stage of visual working memory fails in aMCI, and can DLPFC rTMS help?</text>

  <!-- ===== STUDY（左侧竖长框） ===== -->
  <rect x="28" y="146" width="364" height="632" rx="18" fill="#EEF2F9" stroke="#2F5597" stroke-width="2.5"/>
  <rect x="150" y="130" width="120" height="36" rx="8" fill="#2F5597"/>
  <text x="210" y="155" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="1.5" fill="#FFFFFF">STUDY</text>

