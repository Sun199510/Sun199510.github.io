  <text x="126" y="352" text-anchor="middle" font-size="15" fill="#4B5563">patients</text>
  <text x="294" y="332" text-anchor="middle" font-size="19" font-weight="700" fill="#2F5597">15 healthy</text>
  <text x="294" y="352" text-anchor="middle" font-size="15" fill="#4B5563">elderly controls</text>

