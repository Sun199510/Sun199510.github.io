    <rect x="128" y="650" width="38" height="110" fill="#BFD3E3"/><rect x="172" y="643.6" width="38" height="116.4" fill="#E08A3C"/>
    <rect x="268" y="650" width="38" height="110" fill="#BFD3E3"/><rect x="312" y="644.8" width="38" height="115.2" fill="#E08A3C"/>
    <rect x="408" y="650" width="38" height="110" fill="#BFD3E3"/><rect x="452" y="632.8" width="38" height="127.2" fill="#E08A3C"/>
    <g font-size="18" font-weight="700" fill="#B9692A" text-anchor="middle">
      <text x="191" y="634">+5.8%</text><text x="331" y="635">+4.7%</text><text x="471" y="623">+15.6%</text>
    </g>
    <g font-size="15" fill="#374151" text-anchor="middle">
      <text x="169" y="782">SNR</text><text x="309" y="782">accuracy</text><text x="449" y="782">ITR</text>
    </g>
  </g>
  <g transform="translate(548 640)" font-size="15" fill="#374151">
    <rect x="0" y="-12" width="16" height="16" fill="#BFD3E3"/><text x="24" y="2">pre</text>
    <rect x="0" y="16" width="16" height="16" fill="#E08A3C"/><text x="24" y="30">post NFT</text>
    <text x="0" y="78" font-weight="600" fill="#2F5F82">Control group:</text>
    <text x="0" y="98" fill="#4B5563">no improvement</text>
  </g>

  <line x1="690" y1="566" x2="690" y2="782" stroke="#C9D6E2" stroke-width="2"/>

  <text x="724" y="586" font-size="23" fill="#1F2937">Implication</text>
  <line x1="724" y1="598" x2="1170" y2="598" stroke="#2B2B2B" stroke-width="1.6"/>
  <g transform="translate(734 630)" font-size="17" fill="#1F2937">
