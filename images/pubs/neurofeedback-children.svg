    <text x="28" y="12">Neuromodulation can aid BCIs</text>
    <text x="28" y="32" font-size="15" fill="#4B5563">train the user, not only the decoder</text>
    <text x="28" y="70">Supports children's BCI use</text>
    <text x="28" y="90" font-size="15" fill="#4B5563">via attention-related training</text>
    <text x="28" y="128">Sheds light on the parietal role</text>
    <text x="28" y="148" font-size="15" fill="#4B5563">within the control network</text>
  </g>
