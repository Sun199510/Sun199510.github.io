    <g fill="#C9D3E0"><circle cx="-26" cy="-30" r="7"/><circle cx="26" cy="-30" r="7"/><circle cx="-34" cy="28" r="7"/><circle cx="34" cy="28" r="7"/></g>
    <path d="M0 10 L0 22" stroke="#D9762B" stroke-width="8" stroke-linecap="round" marker-end="url(#ao)"/>
    <circle cx="0" cy="-6" r="15" fill="#D9762B"/>
    <text x="0" y="-1" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">P</text>
    <circle cx="0" cy="44" r="15" fill="#3E83B5"/>
    <text x="0" y="49" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">O</text>
  </g>
  <text x="430" y="514" text-anchor="middle" font-size="16" fill="#1F2937">parietal → occipital flow ↑</text>
  <text x="430" y="533" text-anchor="middle" font-size="14" fill="#6B7280">network analysis</text>

  <path d="M548 436 L612 436" stroke="#2B2B2B" stroke-width="2.4" marker-end="url(#ak)"/>

