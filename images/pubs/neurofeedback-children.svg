    <ellipse cx="-58" cy="0" rx="6" ry="14" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
    <ellipse cx="58" cy="0" rx="6" ry="14" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
    <circle r="56" fill="#F3F1EC"/>
    <g clip-path="url(#scalp)">
