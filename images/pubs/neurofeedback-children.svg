    <circle r="56" fill="none" stroke="#6B7280" stroke-width="2"/>
    <g fill="#2B2B2B"><circle cx="-20" cy="-36" r="2.6"/><circle cx="20" cy="-36" r="2.6"/><circle cx="-36" cy="-10" r="2.6"/><circle cx="0" cy="-14" r="2.6"/><circle cx="36" cy="-10" r="2.6"/><circle cx="-24" cy="14" r="2.6"/><circle cx="0" cy="12" r="2.6"/><circle cx="24" cy="14" r="2.6"/><circle cx="-16" cy="38" r="2.6"/><circle cx="16" cy="38" r="2.6"/></g>
  </g>
  <text x="170" y="514" text-anchor="middle" font-size="16" fill="#1F2937">parietal α ↑</text>
  <text x="170" y="533" text-anchor="middle" font-size="14" fill="#6B7280">trained by NFT</text>

  <path d="M244 436 L300 436" stroke="#2B2B2B" stroke-width="2.4" marker-end="url(#ak)"/>

