      <line x1="40" y1="112" x2="58" y2="112" stroke="#3E83B5" stroke-width="3"/><text x="64" y="117" fill="#2F6E9E">post NFT</text>
    </g>
  </g>
  <text x="1000" y="524" text-anchor="middle" font-size="16" fill="#1F2937">stronger SSVEP response</text>

  <!-- ============ 3 结果 ============ -->
  <text x="86" y="586" font-size="23" fill="#1F2937">Better SSVEP-BCI performance after NFT</text>
  <line x1="86" y1="598" x2="660" y2="598" stroke="#2B2B2B" stroke-width="1.6"/>
  <!-- 前后柱状（按摘要百分比比例） -->
