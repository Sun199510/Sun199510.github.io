<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="'Segoe UI', Arial, Helvetica, sans-serif">
  <defs>
    <symbol id="person" viewBox="-22 -50 44 76" overflow="visible">
      <circle cx="0" cy="-33" r="13"/>
      <path d="M-19 26 L-19 -4 Q-19 -17 -6 -17 L6 -17 Q19 -17 19 -4 L19 26 Z"/>
    </symbol>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBE3D6"/><stop offset="1" stop-color="#EFC4AE"/></linearGradient>
    <linearGradient id="capBG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7890A5"/><stop offset="1" stop-color="#4F6B82"/></linearGradient>
    <linearGradient id="capRd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C46A63"/><stop offset="1" stop-color="#A3443E"/></linearGradient>
    <marker id="ab" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4F6B82"/></marker>
    <marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2B2B2B"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#A3443E"/></marker>
    <g id="head">
      <path d="M120 400 C120 345 108 318 94 292 C70 250 64 198 80 158 C100 100 160 62 226 62 C292 62 336 106 343 160 C346 180 345 194 351 207 C359 221 373 235 377 247 C379 254 372 258 362 260 C365 268 366 274 360 278 C364 285 362 292 354 296 C351 312 343 322 325 324 C305 326 290 326 284 332 L280 400 Z" fill="url(#skin)" stroke="#B98A74" stroke-width="5"/>
    </g>
  </defs>

  <rect width="1200" height="800" fill="#FFFFFF"/>

  <!-- 标题 + 问题 -->
  <text x="600" y="46" text-anchor="middle" font-size="29" font-weight="700" fill="#2A3440">EEG signatures of cognitive decline after mild SARS-CoV-2 infection</text>
  <rect x="200" y="64" width="800" height="42" rx="10" fill="#FDF0C2" stroke="#E2BC52" stroke-width="2"/>
  <text x="600" y="92" text-anchor="middle" font-size="19" fill="#3D3420">How does a mild infection change the resting brain, and does age matter?</text>

  <!-- ===== STUDY DESIGN ===== -->
  <rect x="28" y="144" width="1144" height="218" rx="18" fill="#F1F4F7" stroke="#4F6B82" stroke-width="2.5"/>
  <rect x="500" y="128" width="200" height="36" rx="8" fill="#4F6B82"/>
  <text x="600" y="153" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="1.5" fill="#FFFFFF">STUDY DESIGN</text>

  <!-- 四个年龄组人群 -->
  <ellipse cx="154" cy="298" rx="104" ry="10" fill="#DCE3EA"/>
  <use href="#person" x="70" y="250" width="28" height="48" fill="#C98B85"/>
  <use href="#person" x="104" y="239" width="34" height="59" fill="#8BA0B2"/>
  <use href="#person" x="146" y="229" width="40" height="69" fill="#A3443E"/>
  <use href="#person" x="194" y="222" width="44" height="76" fill="#4F6B82"/>
  <text x="154" y="212" text-anchor="middle" font-size="15" fill="#4B5563">4 age groups</text>
  <text x="154" y="330" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2937">185 participants</text>
  <text x="154" y="350" text-anchor="middle" font-size="14" fill="#4B5563">same people, twice</text>

  <path d="M252 250 L322 250" stroke="#2B2B2B" stroke-width="2.4" marker-end="url(#ak)"/>

  <!-- 感染前脑电 -->
  <g transform="translate(324 180) scale(0.3)">
    <use href="#head"/>
    <path d="M78 176 C86 104 150 52 226 52 C300 52 346 102 352 170 C300 150 150 146 78 176 Z" fill="url(#capBG)" stroke="#3A5266" stroke-width="5"/>
    <g fill="#F5F7FA" stroke="#2F4558" stroke-width="6"><circle cx="120" cy="128" r="12"/><circle cx="170" cy="92" r="12"/><circle cx="226" cy="80" r="12"/><circle cx="282" cy="96" r="12"/><circle cx="322" cy="134" r="12"/><circle cx="196" cy="136" r="12"/><circle cx="260" cy="136" r="12"/></g>
  </g>
  <text x="390" y="330" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2937">Pre-infection</text>
  <text x="390" y="350" text-anchor="middle" font-size="14" fill="#4B5563">resting-state EEG</text>

  <path d="M452 250 L540 250" stroke="#2B2B2B" stroke-width="2.4" marker-end="url(#ak)"/>

  <!-- 病毒 -->
  <g transform="translate(610 246)">
    <g stroke="#A3443E" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="0" x2="42" y2="0"/><line x1="0" y1="0" x2="34" y2="24.7"/><line x1="0" y1="0" x2="13" y2="40"/><line x1="0" y1="0" x2="-13" y2="40"/><line x1="0" y1="0" x2="-34" y2="24.7"/>
      <line x1="0" y1="0" x2="-42" y2="0"/><line x1="0" y1="0" x2="-34" y2="-24.7"/><line x1="0" y1="0" x2="-13" y2="-40"/><line x1="0" y1="0" x2="13" y2="-40"/><line x1="0" y1="0" x2="34" y2="-24.7"/>
    </g>
    <g fill="#A3443E"><circle cx="44" cy="0" r="6"/><circle cx="35.6" cy="25.9" r="6"/><circle cx="13.6" cy="41.8" r="6"/><circle cx="-13.6" cy="41.8" r="6"/><circle cx="-35.6" cy="25.9" r="6"/><circle cx="-44" cy="0" r="6"/><circle cx="-35.6" cy="-25.9" r="6"/><circle cx="-13.6" cy="-41.8" r="6"/><circle cx="13.6" cy="-41.8" r="6"/><circle cx="35.6" cy="-25.9" r="6"/></g>
    <circle r="31" fill="#E8B9B4" stroke="#A3443E" stroke-width="3"/>
    <g fill="#C46A63"><circle cx="-10" cy="-8" r="5"/><circle cx="11" cy="-12" r="4"/><circle cx="6" cy="10" r="6"/><circle cx="-14" cy="13" r="3.5"/></g>
  </g>
  <text x="610" y="330" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2937">Mild SARS-CoV-2</text>
  <text x="610" y="350" text-anchor="middle" font-size="14" fill="#4B5563">infection</text>

  <path d="M680 250 L760 250" stroke="#2B2B2B" stroke-width="2.4" marker-end="url(#ak)"/>

  <!-- 感染后脑电 -->
  <g transform="translate(764 180) scale(0.3)">
    <use href="#head"/>
    <path d="M78 176 C86 104 150 52 226 52 C300 52 346 102 352 170 C300 150 150 146 78 176 Z" fill="url(#capRd)" stroke="#86332E" stroke-width="5"/>
    <g fill="#F5F7FA" stroke="#6E2A26" stroke-width="6"><circle cx="120" cy="128" r="12"/><circle cx="170" cy="92" r="12"/><circle cx="226" cy="80" r="12"/><circle cx="282" cy="96" r="12"/><circle cx="322" cy="134" r="12"/><circle cx="196" cy="136" r="12"/><circle cx="260" cy="136" r="12"/></g>
  </g>
  <text x="830" y="330" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2937">Post-infection</text>
  <text x="830" y="350" text-anchor="middle" font-size="14" fill="#4B5563">resting-state EEG</text>

  <path d="M892 250 L976 250" stroke="#2B2B2B" stroke-width="2.4" marker-end="url(#ak)"/>

  <!-- 问卷 -->
  <g transform="translate(1004 184)">
    <rect x="0" y="10" width="92" height="114" rx="8" fill="#FFFFFF" stroke="#8C99AA" stroke-width="2.4"/>
    <rect x="28" y="0" width="36" height="18" rx="5" fill="#8C99AA"/>
    <g stroke="#D5DCE4" stroke-width="5" stroke-linecap="round"><line x1="32" y1="44" x2="78" y2="44"/><line x1="32" y1="70" x2="78" y2="70"/><line x1="32" y1="96" x2="70" y2="96"/></g>
    <g fill="none" stroke="#4F6B82" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 44 l5 5 l9 -11"/><path d="M12 96 l5 5 l9 -11"/></g>
    <rect x="12" y="62" width="14" height="14" rx="3" fill="none" stroke="#9AA3AE" stroke-width="2.2"/>
  </g>
  <text x="1050" y="330" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2937">181 questionnaires</text>
  <text x="1050" y="350" text-anchor="middle" font-size="14" fill="#4B5563">long-term symptoms</text>

  <!-- 设计 → 两个结果框 -->
  <path d="M364 366 L364 384" stroke="#4F6B82" stroke-width="6" marker-end="url(#ab)"/>
  <path d="M956 366 L956 384" stroke="#4F6B82" stroke-width="6" marker-end="url(#ab)"/>

  <!-- ===== EEG CHANGES ===== -->
  <rect x="28" y="412" width="672" height="364" rx="18" fill="#FBF3F2" stroke="#A3443E" stroke-width="2.5"/>
  <rect x="254" y="396" width="220" height="36" rx="8" fill="#A3443E"/>
  <text x="364" y="421" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="1.5" fill="#FFFFFF">EEG CHANGES</text>
  <line x1="364" y1="452" x2="364" y2="706" stroke="#E7C6C2" stroke-width="2"/>

  <!-- 低频同步 -->
  <text x="196" y="466" text-anchor="middle" font-size="19" font-weight="700" fill="#1F2937">Low-frequency synchrony ↑</text>
  <text x="196" y="488" text-anchor="middle" font-size="14" fill="#4B5563">δ / θ bands</text>
  <text x="54" y="537" font-size="15" fill="#4F6B82" font-weight="600">pre</text>
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M100 532 q15 -26 30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0" stroke="#4F6B82"/>
    <path d="M100 532 q15 26 30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0" stroke="#9FB1C1"/>
  </g>
  <text x="54" y="619" font-size="15" fill="#A3443E" font-weight="600">post</text>
  <g fill="none" stroke-width="3.4" stroke-linecap="round">
    <path d="M100 612 q15 -36 30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0" stroke="#A3443E"/>
    <path d="M100 620 q15 -36 30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0" stroke="#D99791"/>
  </g>
  <text x="196" y="672" text-anchor="middle" font-size="15" fill="#374151">θ-band Hjorth activity ↑</text>
  <text x="196" y="696" text-anchor="middle" font-size="15" fill="#374151">δ-band Hjorth mobility ↑</text>

  <!-- Hurst 指数 -->
  <text x="532" y="466" text-anchor="middle" font-size="19" font-weight="700" fill="#1F2937">Hurst exponent ↓</text>
  <text x="532" y="488" text-anchor="middle" font-size="14" fill="#4B5563">across all age groups</text>
  <text x="384" y="537" font-size="15" fill="#4F6B82" font-weight="600">pre</text>
  <path d="M424 540 l9 -4 l9 -6 l9 -2 l9 -7 l9 -3 l9 2 l9 -5 l9 -6 l9 -2 l9 3 l9 4 l9 6 l9 3 l9 5 l9 -2 l9 -3 l9 -6 l9 -4 l9 -5" fill="none" stroke="#4F6B82" stroke-width="2.6" stroke-linejoin="round"/>
  <text x="384" y="619" font-size="15" fill="#A3443E" font-weight="600">post</text>
  <path d="M424 614 l9 -12 l9 14 l9 -10 l9 13 l9 -15 l9 11 l9 -9 l9 14 l9 -13 l9 10 l9 -12 l9 15 l9 -11 l9 9 l9 -14 l9 12 l9 -10 l9 13 l9 -12" fill="none" stroke="#A3443E" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- H 柱 -->
  <line x1="618" y1="630" x2="688" y2="630" stroke="#2B2B2B" stroke-width="2"/>
  <rect x="626" y="540" width="24" height="90" rx="3" fill="#8BA0B2"/>
  <rect x="658" y="580" width="24" height="50" rx="3" fill="#A3443E"/>
  <text x="654" y="530" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2937">H</text>
  <text x="532" y="672" text-anchor="middle" font-size="15" fill="#374151">more disordered EEG dynamics</text>
  <text x="532" y="696" text-anchor="middle" font-size="15" fill="#374151">after infection</text>

  <line x1="60" y1="718" x2="668" y2="718" stroke="#E7C6C2" stroke-width="2"/>
  <text x="364" y="750" text-anchor="middle" font-size="16" fill="#1F2937"><tspan font-weight="700">Overall:</tspan> cognitive decline and increased EEG disarray</text>

  <!-- ===== AGE & SYMPTOMS ===== -->
  <rect x="740" y="412" width="432" height="364" rx="18" fill="#F1F4F7" stroke="#4F6B82" stroke-width="2.5"/>
  <rect x="841" y="396" width="230" height="36" rx="8" fill="#4F6B82"/>
  <text x="956" y="421" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="1.5" fill="#FFFFFF">AGE &amp; SYMPTOMS</text>

  <text x="956" y="466" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2937">Network &amp; microstate change</text>
  <!-- 示意柱 -->
  <line x1="790" y1="480" x2="790" y2="594" stroke="#2B2B2B" stroke-width="2"/>
  <line x1="790" y1="594" x2="1126" y2="594" stroke="#2B2B2B" stroke-width="2"/>
  <rect x="808" y="556" width="44" height="38" rx="3" fill="#E3A9A3"/>
  <rect x="884" y="548" width="44" height="46" rx="3" fill="#E3A9A3"/>
  <rect x="960" y="504" width="44" height="90" rx="3" fill="#A3443E"/>
  <rect x="1036" y="494" width="44" height="100" rx="3" fill="#A3443E"/>
  <!-- 年龄递增的人 -->
  <use href="#person" x="819" y="606" width="22" height="38" fill="#8BA0B2"/>
  <use href="#person" x="893" y="596" width="26" height="48" fill="#8BA0B2"/>
  <use href="#person" x="967" y="588" width="30" height="56" fill="#4F6B82"/>
  <use href="#person" x="1041" y="582" width="34" height="62" fill="#4F6B82"/>
  <path d="M806 654 L806 662 L930 662 L930 654" fill="none" stroke="#2B2B2B" stroke-width="1.8"/>
  <text x="868" y="684" text-anchor="middle" font-size="15" fill="#374151">children &amp; adolescents</text>
  <text x="868" y="702" text-anchor="middle" font-size="14" fill="#4B5563">smaller change</text>
  <path d="M960 662 L1100 662" stroke="#6B7280" stroke-width="1.8" marker-end="url(#ak)"/>
  <text x="1030" y="684" text-anchor="middle" font-size="14" fill="#4B5563">age group</text>

  <line x1="764" y1="716" x2="1148" y2="716" stroke="#C9D3DD" stroke-width="2"/>
  <path d="M766 736 l6 6 l11 -13" fill="none" stroke="#A3443E" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="794" y="742" font-size="16" fill="#1F2937">Larger EEG change goes with more</text>
  <text x="794" y="762" font-size="16" fill="#1F2937">persistent long-term symptoms</text>
</svg>
