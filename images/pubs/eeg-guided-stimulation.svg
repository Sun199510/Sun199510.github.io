    <circle r="72" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
    <circle r="40" fill="url(#ctrl)"/>
    <g stroke="#7FB3B5" stroke-width="2">
      <line x1="0" y1="0" x2="-30" y2="-44"/><line x1="0" y1="0" x2="30" y2="-44"/><line x1="0" y1="0" x2="-48" y2="4"/>
      <line x1="0" y1="0" x2="48" y2="4"/><line x1="0" y1="0" x2="-26" y2="44"/><line x1="0" y1="0" x2="26" y2="44"/>
      <line x1="-30" y1="-44" x2="30" y2="-44"/><line x1="-48" y1="4" x2="-26" y2="44"/><line x1="48" y1="4" x2="26" y2="44"/>
      <line x1="-30" y1="-44" x2="-48" y2="4"/><line x1="30" y1="-44" x2="48" y2="4"/><line x1="-26" y1="44" x2="26" y2="44"/>
      <line x1="0" y1="-22" x2="0" y2="0"/><line x1="-22" y1="14" x2="0" y2="0"/><line x1="22" y1="14" x2="0" y2="0"/>
    </g>
    <g fill="#1F6F73" stroke="#FFFFFF" stroke-width="2">
      <circle cx="-30" cy="-44" r="6.5"/><circle cx="30" cy="-44" r="6.5"/><circle cx="-48" cy="4" r="6.5"/>
      <circle cx="48" cy="4" r="6.5"/><circle cx="-26" cy="44" r="6.5"/><circle cx="26" cy="44" r="6.5"/>
    </g>
    <g fill="#A8323E" stroke="#FFFFFF" stroke-width="2">
      <circle cx="0" cy="-22" r="7"/><circle cx="-22" cy="14" r="7"/><circle cx="22" cy="14" r="7"/>
      <circle cx="0" cy="0" r="10"/>
    </g>
    <text x="14" y="-4" font-size="14" font-weight="700" fill="#A8323E">Cz</text>
  </g>
  <path d="M866 210 L782 268" stroke="#A8323E" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#acs)"/>
  <text x="756" y="408" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2937">Controllability targets</text>
  <text x="756" y="430" text-anchor="middle" font-size="15" fill="#4B5563">spectral graph embedding +</text>
  <text x="756" y="450" text-anchor="middle" font-size="15" fill="#4B5563">structural controllability</text>

  <path d="M882 290 L906 290" stroke="#1F6F73" stroke-width="6" marker-end="url(#at)"/>

  <!-- 4 NSGA-II 帕累托前沿 -->
  <g>
    <rect x="962" y="196" width="180" height="140" rx="6" fill="#FFFFFF"/>
    <line x1="962" y1="336" x2="1142" y2="336" stroke="#2B2B2B" stroke-width="2"/>
    <line x1="962" y1="196" x2="962" y2="336" stroke="#2B2B2B" stroke-width="2"/>
    <g fill="#B7C3C4">
      <circle cx="1010" cy="300" r="5"/><circle cx="1036" cy="282" r="5"/><circle cx="1060" cy="308" r="5"/><circle cx="1084" cy="270" r="5"/>
      <circle cx="1104" cy="292" r="5"/><circle cx="1122" cy="252" r="5"/><circle cx="1048" cy="256" r="5"/><circle cx="1076" cy="236" r="5"/>
      <circle cx="1096" cy="318" r="5"/><circle cx="1120" cy="226" r="5"/><circle cx="1000" cy="320" r="5"/>
    </g>
    <path d="M978 318 C992 262 1030 228 1132 210" fill="none" stroke="#A8323E" stroke-width="3"/>
    <g fill="#A8323E"><circle cx="984" cy="296" r="5.5"/><circle cx="1000" cy="262" r="5.5"/><circle cx="1050" cy="226" r="5.5"/><circle cx="1090" cy="215" r="5.5"/><circle cx="1128" cy="211" r="5.5"/></g>
    <path d="M1020 228 l4.2 8.6 9.4 1.4 -6.8 6.6 1.6 9.4 -8.4 -4.4 -8.4 4.4 1.6 -9.4 -6.8 -6.6 9.4 -1.4 Z" fill="#E2BC52" stroke="#8A6417" stroke-width="1.5"/>
    <text x="1052" y="356" text-anchor="middle" font-size="14" fill="#4B5563">control energy →</text>
    <text transform="translate(950 266) rotate(-90)" text-anchor="middle" font-size="14" fill="#4B5563">efficiency gain →</text>
  </g>
  <text x="1040" y="408" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2937">Multi-objective search</text>
  <text x="1040" y="430" text-anchor="middle" font-size="15" fill="#4B5563">NSGA-II: min. control energy,</text>
  <text x="1040" y="450" text-anchor="middle" font-size="15" fill="#4B5563">max. efficiency &amp; restoration</text>

  <!-- FRAMEWORK → VALIDATION -->
  <path d="M150 494 L150 520" stroke="#1F6F73" stroke-width="6" marker-end="url(#at)"/>

  <!-- ===== IN-SILICO VALIDATION ===== -->
  <rect x="28" y="540" width="572" height="238" rx="18" fill="#FFFFFF" stroke="#1F6F73" stroke-width="2.5"/>
  <rect x="204" y="524" width="220" height="36" rx="8" fill="#1F6F73"/>
  <text x="314" y="549" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="1.5" fill="#FFFFFF">IN-SILICO TEST</text>

  <!-- 个体化方案卡片 -->
  <g transform="translate(52 582)">
    <rect x="0" y="0" width="140" height="150" rx="10" fill="#FFFFFF" stroke="#8C99AA" stroke-width="2.2"/>
    <path d="M0 10 Q0 0 10 0 L130 0 Q140 0 140 10 L140 30 L0 30 Z" fill="#A8323E"/>
    <text x="70" y="21" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">personal plan</text>
    <g font-size="15" fill="#1F2937">
      <circle cx="18" cy="56" r="6" fill="#A8323E"/><text x="32" y="61">node</text>
      <path d="M12 92 q3 -10 6 0 t6 0" fill="none" stroke="#1F6F73" stroke-width="2.4"/><text x="32" y="97">frequency</text>
      <rect x="12" y="122" width="4" height="8" fill="#1F6F73"/><rect x="18" y="118" width="4" height="12" fill="#1F6F73"/><rect x="24" y="114" width="4" height="16" fill="#1F6F73"/>
      <text x="32" y="131">amplitude</text>
    </g>
  </g>
  <path d="M200 656 L226 656" stroke="#2B2B2B" stroke-width="2.4" marker-end="url(#ac)"/>

  <!-- Kuramoto 振子 -->
  <g transform="translate(296 650)">
    <circle r="56" fill="#EEF6F6" stroke="#7FB3B5" stroke-width="2"/>
    <g fill="#1F6F73" stroke="#FFFFFF" stroke-width="1.5">
      <circle cx="44" cy="-35" r="6"/><circle cx="52" cy="-21" r="6"/><circle cx="30" cy="-47" r="6"/><circle cx="55" cy="-6" r="6"/>
      <circle cx="16" cy="-54" r="6"/><circle cx="-20" cy="-52" r="6"/><circle cx="54" cy="16" r="6"/><circle cx="-50" cy="24" r="6"/>
    </g>
