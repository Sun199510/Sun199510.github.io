    <path d="M120 400 C120 345 108 318 94 292 C70 250 64 198 80 158 C100 100 160 62 226 62 C292 62 336 106 343 160 C346 180 345 194 351 207 C359 221 373 235 377 247 C379 254 372 258 362 260 C365 268 366 274 360 278 C364 285 362 292 354 296 C351 312 343 322 325 324 C305 326 290 326 284 332 L280 400 Z" fill="url(#skin)" stroke="#B98A74" stroke-width="4.5"/>
    <path d="M78 176 C86 104 150 52 226 52 C300 52 346 102 352 170 C300 150 150 146 78 176 Z" fill="url(#cap)" stroke="#174F52" stroke-width="4"/>
    <path d="M96 178 C110 230 150 262 190 282" fill="none" stroke="#1F6F73" stroke-width="7" stroke-linecap="round"/>
    <g fill="#F5F7FA" stroke="#174F52" stroke-width="5">
      <circle cx="120" cy="128" r="12"/><circle cx="170" cy="92" r="12"/><circle cx="226" cy="80" r="12"/><circle cx="282" cy="96" r="12"/><circle cx="322" cy="134" r="12"/>
      <circle cx="176" cy="140" r="12"/><circle cx="232" cy="128" r="12"/><circle cx="284" cy="146" r="12"/>
    </g>
    <path d="M226 52 C230 20 262 4 300 8" fill="none" stroke="#6B7280" stroke-width="7"/>
  </g>
  <g fill="none" stroke-width="2" stroke-linejoin="round">
    <path stroke="#1F6F73" d="M222 246 l6 -6 l6 8 l6 -10 l6 8 l6 -4 l6 7 l6 -8 l6 5 l6 -3 l6 4"/>
    <path stroke="#A8323E" d="M222 276 l6 5 l6 -8 l6 9 l6 -6 l6 7 l6 -10 l6 8 l6 -4 l6 5 l6 -3"/>
    <path stroke="#1F6F73" d="M222 306 l6 -7 l6 5 l6 -4 l6 9 l6 -8 l6 5 l6 -3 l6 7 l6 -8 l6 4"/>
  </g>
  <text x="170" y="408" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2937">Resting-state EEG</text>
  <text x="170" y="430" text-anchor="middle" font-size="15" fill="#4B5563">34 MDD · 30 healthy controls</text>

  <path d="M302 290 L330 290" stroke="#1F6F73" stroke-width="6" marker-end="url(#at)"/>

  <!-- 2 多频段连接网络 -->
  <g stroke="#FFFFFF" stroke-width="1.5">
    <path d="M378 318 L522 318 L562 266 L418 266 Z" fill="#B9DADB"/>
    <path d="M378 302 L522 302 L562 250 L418 250 Z" fill="#A3CED0"/>
    <path d="M378 286 L522 286 L562 234 L418 234 Z" fill="#8CC2C4"/>
    <path d="M378 270 L522 270 L562 218 L418 218 Z" fill="#75B5B8"/>
  </g>
  <path d="M378 254 L522 254 L562 202 L418 202 Z" fill="#FFFFFF" stroke="#1F6F73" stroke-width="2"/>
  <g stroke-linecap="round">
    <line x1="412" y1="240" x2="452" y2="214" stroke="#A8323E" stroke-width="3.4"/>
    <line x1="452" y1="214" x2="508" y2="216" stroke="#1F6F73" stroke-width="2"/>
    <line x1="412" y1="240" x2="470" y2="236" stroke="#1F6F73" stroke-width="2.6"/>
