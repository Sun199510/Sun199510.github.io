    <circle r="4" fill="#2B2B2B"/>
  </g>
  <text x="296" y="738" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2937">Kuramoto model</text>
  <text x="296" y="758" text-anchor="middle" font-size="15" fill="#4B5563">simulated stimulation</text>

  <!-- 关键数字 -->
  <g transform="translate(392 600)">
    <text x="0" y="40" font-size="42" font-weight="800" fill="#A8323E">R = 0.68</text>
    <text x="2" y="66" font-size="16" fill="#1F2937">median global synchrony</text>
    <text x="2" y="104" font-size="15" fill="#4B5563">↑ local efficiency</text>
    <text x="2" y="126" font-size="15" fill="#4B5563">↓ network modularity</text>
  </g>

  <!-- VALIDATION → FINDINGS -->
  <path d="M604 660 L628 660" stroke="#A8323E" stroke-width="6" marker-end="url(#ac)"/>

  <!-- ===== KEY FINDINGS ===== -->
  <rect x="640" y="540" width="532" height="238" rx="18" fill="#FBF0F1" stroke="#A8323E" stroke-width="2.5"/>
  <rect x="806" y="524" width="200" height="36" rx="8" fill="#A8323E"/>
  <text x="906" y="549" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="1.5" fill="#FFFFFF">KEY FINDINGS</text>
  <g transform="translate(666 594)" font-size="17" fill="#1F2937">
    <g fill="none" stroke="#A8323E" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 0 l6 6 l11 -13"/><path d="M0 58 l6 6 l11 -13"/><path d="M0 116 l6 6 l11 -13"/>
    </g>
    <text x="28" y="6">MDD: PLV &amp; AEC hyperconnectivity</text>
    <text x="28" y="26" font-size="15" fill="#4B5563">and reduced wPLI vs. controls</text>
    <text x="28" y="64">Control nodes more central in MDD</text>
    <text x="28" y="84" font-size="15" fill="#4B5563">especially around Cz in α and β bands</text>
    <text x="28" y="122">Individualized plans beat random</text>
    <text x="28" y="142" font-size="15" fill="#4B5563">in restoring network-level metrics</text>
  </g>
  <!-- 个体化 vs 随机 示意 -->
  <g transform="translate(1050 668)">
    <line x1="0" y1="80" x2="88" y2="80" stroke="#2B2B2B" stroke-width="2"/>
    <rect x="10" y="18" width="28" height="62" rx="2" fill="#A8323E"/>
    <rect x="58" y="52" width="28" height="28" rx="2" fill="#B7C3C4"/>
    <text x="24" y="98" text-anchor="middle" font-size="14" fill="#4B5563">plan</text>
    <text x="72" y="98" text-anchor="middle" font-size="14" fill="#4B5563">random</text>
