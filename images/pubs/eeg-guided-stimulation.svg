<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="'Segoe UI', Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBE3D6"/><stop offset="1" stop-color="#EFC4AE"/></linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3C9A9E"/><stop offset="1" stop-color="#1F6F73"/></linearGradient>
    <radialGradient id="ctrl" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#A8323E" stop-opacity="0.45"/><stop offset="1" stop-color="#A8323E" stop-opacity="0"/></radialGradient>
    <marker id="at" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1F6F73"/></marker>
    <marker id="ac" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#A8323E"/></marker>
    <marker id="acs" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#A8323E"/></marker>
  </defs>

  <rect width="1200" height="800" fill="#FFFFFF"/>

  <!-- ===== 标题 + 问题 ===== -->
  <text x="600" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#174F52">Personalized EEG-guided stimulation targeting in depression</text>
  <rect x="190" y="68" width="820" height="44" rx="10" fill="#FDF0C2" stroke="#E2BC52" stroke-width="2"/>
  <text x="600" y="97" text-anchor="middle" font-size="19" fill="#3D3420">Where should brain stimulation be delivered for each patient with depression?</text>

  <!-- ===== FRAMEWORK ===== -->
  <rect x="28" y="146" width="1144" height="344" rx="18" fill="#EEF6F6" stroke="#1F6F73" stroke-width="2.5"/>
  <rect x="495" y="130" width="210" height="36" rx="8" fill="#1F6F73"/>
  <text x="600" y="155" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="1.5" fill="#FFFFFF">FRAMEWORK</text>

  <!-- 步骤编号 -->
  <g font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <circle cx="62" cy="190" r="15" fill="#1F6F73"/><text x="62" y="196">1</text>
    <circle cx="346" cy="190" r="15" fill="#1F6F73"/><text x="346" y="196">2</text>
    <circle cx="630" cy="190" r="15" fill="#1F6F73"/><text x="630" y="196">3</text>
    <circle cx="914" cy="190" r="15" fill="#1F6F73"/><text x="914" y="196">4</text>
  </g>

