    <line x1="528" y1="238" x2="540" y2="210" stroke="#A8323E" stroke-width="2.4"/>
    <line x1="452" y1="214" x2="470" y2="236" stroke="#1F6F73" stroke-width="1.6"/>
  </g>
  <g fill="#1F6F73" stroke="#FFFFFF" stroke-width="1.6">
    <circle cx="412" cy="240" r="6"/><circle cx="452" cy="214" r="6"/><circle cx="470" cy="236" r="7"/>
    <circle cx="508" cy="216" r="6"/><circle cx="528" cy="238" r="6"/><circle cx="540" cy="210" r="5"/>
  </g>
  <g font-size="15" font-weight="700" text-anchor="middle">
    <rect x="378" y="340" width="54" height="26" rx="13" fill="#FFFFFF" stroke="#1F6F73" stroke-width="1.8"/><text x="405" y="358" fill="#1F6F73">PLV</text>
    <rect x="442" y="340" width="54" height="26" rx="13" fill="#FFFFFF" stroke="#1F6F73" stroke-width="1.8"/><text x="469" y="358" fill="#1F6F73">AEC</text>
    <rect x="506" y="340" width="62" height="26" rx="13" fill="#FFFFFF" stroke="#1F6F73" stroke-width="1.8"/><text x="537" y="358" fill="#1F6F73">wPLI</text>
  </g>
  <text x="472" y="408" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2937">Connectivity networks</text>
  <text x="472" y="430" text-anchor="middle" font-size="15" fill="#4B5563">across 5 frequency bands</text>

  <path d="M600 290 L622 290" stroke="#1F6F73" stroke-width="6" marker-end="url(#at)"/>

