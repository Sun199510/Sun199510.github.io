<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="'Segoe UI', Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="scalpG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8E0D2"/><stop offset="1" stop-color="#EFC9B6"/></linearGradient>
    <linearGradient id="cortexG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F5D9D2"/><stop offset="1" stop-color="#EBBFB5"/></linearGradient>
    <pattern id="bone" width="18" height="16" patternUnits="userSpaceOnUse">
      <rect width="18" height="16" fill="#F2EADA"/>
      <circle cx="5" cy="5" r="3" fill="#DDCBA6"/><circle cx="14" cy="12" r="2.4" fill="#DDCBA6"/>
    </pattern>
    <clipPath id="sec"><rect x="60" y="230" width="420" height="330" rx="18"/></clipPath>
    <marker id="aa" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#C98A1E"/></marker>
    <marker id="as" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3E5C7A"/></marker>
    <marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2B2B2B"/></marker>
    <g id="neuron">
      <path d="M0 -40 L0 -10 M0 -30 L-10 -42 M0 -26 L11 -38 M-6 6 L-18 16 M6 6 L18 16 M0 8 L0 20" fill="none" stroke="#3E5C7A" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M0 -12 L10 8 L-10 8 Z" fill="#5B7FA3" stroke="#3E5C7A" stroke-width="1.5"/>
    </g>
  </defs>

  <rect width="1200" height="800" fill="#FFFFFF"/>

  <!-- title + question -->
  <text x="600" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#22364C">Creating ionic current pathways through the skull</text>
  <rect x="150" y="66" width="900" height="44" rx="10" fill="#FDF0C2" stroke="#E2BC52" stroke-width="2"/>
  <text x="600" y="95" text-anchor="middle" font-size="19" fill="#3D3420">Can scalp electrodes pick up cortical-quality signals without implanting electrodes?</text>

  <!-- ===== APPROACH (left, tall) ===== -->
  <rect x="28" y="146" width="600" height="634" rx="18" fill="#F2F5F9" stroke="#5B7FA3" stroke-width="2.5"/>
  <rect x="238" y="130" width="180" height="36" rx="8" fill="#3E5C7A"/>
  <text x="328" y="155" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="1.5" fill="#FFFFFF">APPROACH</text>

  <!-- hair -->
  <g stroke="#7A6656" stroke-width="2" stroke-linecap="round">
    <line x1="84" y1="232" x2="80" y2="219"/><line x1="108" y1="232" x2="106" y2="218"/><line x1="132" y1="232" x2="128" y2="220"/>
    <line x1="156" y1="232" x2="154" y2="219"/><line x1="180" y1="232" x2="176" y2="220"/><line x1="204" y1="232" x2="202" y2="219"/>
    <line x1="372" y1="232" x2="370" y2="219"/><line x1="396" y1="232" x2="392" y2="220"/><line x1="420" y1="232" x2="418" y2="219"/>
    <line x1="444" y1="232" x2="440" y2="220"/><line x1="464" y1="232" x2="462" y2="219"/>
  </g>

  <!-- cross-section layers -->
  <g clip-path="url(#sec)">
    <rect x="60" y="230" width="420" height="60" fill="url(#scalpG)"/>
    <rect x="60" y="290" width="420" height="90" fill="url(#bone)"/>
    <rect x="60" y="290" width="420" height="14" fill="#E4D5B6"/>
    <rect x="60" y="366" width="420" height="14" fill="#E4D5B6"/>
    <rect x="60" y="380" width="420" height="14" fill="#B7C6D6"/>
    <rect x="60" y="394" width="420" height="24" fill="#DCE8F3"/>
    <path d="M60 412 C100 404 140 420 180 410 S260 402 300 412 S380 420 420 408 S470 404 480 410 L480 560 L60 560 Z" fill="url(#cortexG)"/>
    <!-- ionic current band -->
    <path d="M230 470 C250 430 286 412 290 394 L290 296 C290 280 270 262 268 240 L332 240 C330 262 310 280 310 296 L310 394 C314 412 350 430 370 470 Z" fill="#F4C76A" fill-opacity="0.28"/>
  </g>
  <rect x="60" y="230" width="420" height="330" rx="18" fill="none" stroke="#8C99AA" stroke-width="2"/>

  <!-- hollow implant -->
  <rect x="288" y="292" width="24" height="88" fill="#F8E3B5"/>
  <rect x="280" y="292" width="8" height="88" fill="#3E5C7A"/>
  <rect x="312" y="292" width="8" height="88" fill="#3E5C7A"/>
  <rect x="272" y="287" width="56" height="7" rx="2" fill="#2C4560"/>
  <g font-size="12" font-weight="700" text-anchor="middle">
    <circle cx="300" cy="312" r="6" fill="#D49A2A"/><circle cx="300" cy="336" r="6" fill="#5B7FA3"/><circle cx="300" cy="360" r="6" fill="#D49A2A"/>
  </g>

  <!-- neurons -->
  <use href="#neuron" x="210" y="500"/>
  <use href="#neuron" x="300" y="492"/>
  <use href="#neuron" x="390" y="500"/>
  <use href="#neuron" x="130" y="510"/>
  <use href="#neuron" x="450" y="512"/>

  <!-- current arrows -->
  <g fill="none" stroke="#C98A1E" stroke-width="4" stroke-linecap="round">
    <path d="M222 452 C240 424 276 414 290 398" marker-end="url(#aa)"/>
    <path d="M300 446 L300 404" marker-end="url(#aa)"/>
    <path d="M378 452 C360 424 324 414 310 398" marker-end="url(#aa)"/>
    <path d="M300 284 L300 246" marker-end="url(#aa)"/>
    <path d="M292 282 C282 268 272 260 262 250" stroke-width="3" marker-end="url(#aa)"/>
    <path d="M308 282 C318 268 328 260 338 250" stroke-width="3" marker-end="url(#aa)"/>
  </g>

  <!-- scalp electrode -->
  <path d="M300 220 C300 196 330 186 384 186" fill="none" stroke="#2C4560" stroke-width="3"/>
  <ellipse cx="300" cy="226" rx="28" ry="7" fill="#3E5C7A" stroke="#22364C" stroke-width="1.5"/>
  <text x="264" y="204" text-anchor="end" font-size="15" fill="#22364C" font-weight="600">scalp electrode</text>

  <!-- callouts -->
  <g stroke="#4B5563" stroke-width="1.5"><line x1="322" y1="322" x2="396" y2="322"/><line x1="286" y1="342" x2="214" y2="342"/></g>
  <rect x="400" y="309" width="104" height="24" rx="5" fill="#FFFFFF" fill-opacity="0.85"/>
  <text x="404" y="327" font-size="15" fill="#22364C" font-weight="600">hollow implant</text>
  <rect x="104" y="329" width="108" height="24" rx="5" fill="#FFFFFF" fill-opacity="0.85"/>
  <text x="208" y="347" text-anchor="end" font-size="15" fill="#8A5A0E" font-weight="600">tissue fluid</text>

  <!-- layer labels -->
  <g stroke="#8C99AA" stroke-width="1.5"><line x1="484" y1="260" x2="512" y2="260"/><line x1="484" y1="335" x2="512" y2="335"/><line x1="484" y1="387" x2="512" y2="387"/><line x1="484" y1="480" x2="512" y2="480"/></g>
  <g font-size="16" fill="#374151">
    <text x="518" y="266">scalp</text><text x="518" y="341">skull</text><text x="518" y="393">dura</text><text x="518" y="486">cortex</text>
  </g>
  <text x="270" y="586" text-anchor="middle" font-size="16" fill="#8A5A0E" font-style="italic">artificial ionic current path (AICP): cortex → scalp</text>

  <!-- procedure steps -->
  <line x1="56" y1="606" x2="600" y2="606" stroke="#C9D3E0" stroke-width="2"/>
  <g font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <circle cx="80" cy="636" r="13" fill="#D49A2A"/><text x="80" y="641">1</text>
    <circle cx="262" cy="636" r="13" fill="#D49A2A"/><text x="262" y="641">2</text>
    <circle cx="444" cy="636" r="13" fill="#D49A2A"/><text x="444" y="641">3</text>
  </g>
  <!-- step 1: ultrasonic tool -->
  <g>
    <rect x="92" y="684" width="100" height="24" rx="4" fill="url(#bone)" stroke="#C9B48A" stroke-width="1.5"/>
    <g transform="rotate(28 150 650)">
      <rect x="140" y="616" width="20" height="50" rx="6" fill="#8C99AA" stroke="#55606E" stroke-width="1.5"/>
      <line x1="150" y1="666" x2="150" y2="684" stroke="#55606E" stroke-width="3"/>
    </g>
    <g fill="none" stroke="#D49A2A" stroke-width="2" stroke-linecap="round">
      <path d="M128 670 C122 676 122 684 126 690"/><path d="M120 664 C112 674 112 688 118 696"/>
    </g>
  </g>
  <!-- step 2: insert implant -->
  <g>
    <rect x="272" y="684" width="100" height="24" rx="4" fill="url(#bone)" stroke="#C9B48A" stroke-width="1.5"/>
    <rect x="312" y="684" width="20" height="24" fill="#FFFFFF"/>
    <rect x="312" y="644" width="20" height="30" fill="#F2F5F9" stroke="#3E5C7A" stroke-width="4"/>
    <path d="M352 646 L352 676" stroke="#3E5C7A" stroke-width="3" marker-end="url(#as)"/>
  </g>
  <!-- step 3: fluid path -->
  <g>
    <rect x="454" y="684" width="100" height="24" rx="4" fill="url(#bone)" stroke="#C9B48A" stroke-width="1.5"/>
    <rect x="494" y="684" width="20" height="24" fill="#F8E3B5" stroke="#3E5C7A" stroke-width="4"/>
    <path d="M504 718 L504 652" stroke="#C98A1E" stroke-width="4" marker-end="url(#aa)"/>
  </g>
  <g stroke="#2B2B2B" stroke-width="2.4"><path d="M206 694 L250 694" marker-end="url(#ak)"/><path d="M388 694 L432 694" marker-end="url(#ak)"/></g>
  <g font-size="15" fill="#374151" text-anchor="middle">
    <text x="142" y="740">ultrasonic tool</text><text x="142" y="759" fill="#6B7280" font-size="14">makes a micro-hole</text>
    <text x="322" y="740">hollow implant</text><text x="322" y="759" fill="#6B7280" font-size="14">prevents healing</text>
    <text x="504" y="740">tissue fluid</text><text x="504" y="759" fill="#6B7280" font-size="14">conducts the signal</text>
  </g>

  <!-- approach → validation -->
  <path d="M632 234 L654 234" stroke="#D49A2A" stroke-width="6" marker-end="url(#aa)"/>

  <!-- ===== VALIDATION ===== -->
  <rect x="664" y="146" width="508" height="176" rx="18" fill="#FFFFFF" stroke="#5B7FA3" stroke-width="2.5"/>
  <rect x="828" y="130" width="180" height="36" rx="8" fill="#3E5C7A"/>
  <text x="918" y="155" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="1.5" fill="#FFFFFF">VALIDATION</text>
  <!-- pig -->
  <g transform="translate(756 238)">
    <path d="M-52 -6 C-64 -14 -66 -26 -56 -28 C-48 -30 -50 -20 -56 -18" fill="none" stroke="#C98E80" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="-36" y="18" width="12" height="26" rx="4" fill="#E8B4A8" stroke="#C98E80" stroke-width="2"/>
    <rect x="-14" y="20" width="12" height="24" rx="4" fill="#E8B4A8" stroke="#C98E80" stroke-width="2"/>
    <rect x="16" y="20" width="12" height="24" rx="4" fill="#E8B4A8" stroke="#C98E80" stroke-width="2"/>
    <rect x="36" y="18" width="12" height="26" rx="4" fill="#E8B4A8" stroke="#C98E80" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="54" ry="34" fill="#F3CEC4" stroke="#C98E80" stroke-width="2.5"/>
    <circle cx="50" cy="-10" r="24" fill="#F3CEC4" stroke="#C98E80" stroke-width="2.5"/>
    <path d="M38 -30 L46 -48 L56 -32 Z" fill="#E8B4A8" stroke="#C98E80" stroke-width="2"/>
    <ellipse cx="74" cy="-4" rx="10" ry="12" fill="#E8B4A8" stroke="#C98E80" stroke-width="2"/>
    <circle cx="72" cy="-8" r="2" fill="#9A5A50"/><circle cx="76" cy="0" r="2" fill="#9A5A50"/>
    <circle cx="56" cy="-16" r="3" fill="#3B2B2B"/>
    <ellipse cx="38" cy="-30" rx="8" ry="3" fill="#3E5C7A"/>
  </g>
  <text x="766" y="306" text-anchor="middle" font-size="15" fill="#4B5563">pig model</text>
  <!-- synchronized traces -->
  <g transform="translate(860 186)">
    <rect x="0" y="0" width="284" height="100" rx="10" fill="#F7F9FB" stroke="#C9D3E0" stroke-width="2"/>
    <path d="M14 34 C24 20 32 46 42 30 S60 18 70 34 S88 48 98 30 S116 16 126 32 S144 46 154 30 S172 20 182 34" fill="none" stroke="#D49A2A" stroke-width="2.6"/>
    <path d="M14 72 C24 58 32 84 42 68 S60 56 70 72 S88 86 98 68 S116 54 126 70 S144 84 154 68 S172 58 182 72" fill="none" stroke="#3E5C7A" stroke-width="2.6"/>
    <text x="194" y="38" font-size="15" font-weight="600" fill="#8A5A0E">AICP scalp</text>
    <text x="194" y="76" font-size="15" font-weight="600" fill="#22364C">perforated</text>
    <text x="194" y="94" font-size="15" font-weight="600" fill="#22364C">ECoG</text>
  </g>
  <text x="1002" y="306" text-anchor="middle" font-size="15" fill="#4B5563">synchronized recordings</text>

  <path d="M730 326 L730 350" stroke="#3E5C7A" stroke-width="6" marker-end="url(#as)"/>

  <!-- ===== KEY FINDINGS ===== -->
  <rect x="664" y="372" width="508" height="224" rx="18" fill="#FDF7EA" stroke="#D49A2A" stroke-width="2.5"/>
  <rect x="818" y="356" width="200" height="36" rx="8" fill="#C98A1E"/>
  <text x="918" y="381" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="1.5" fill="#FFFFFF">KEY FINDINGS</text>
  <!-- spectra -->
  <g>
    <rect x="702" y="416" width="62" height="118" fill="#F4C76A" fill-opacity="0.3"/>
    <line x1="700" y1="534" x2="872" y2="534" stroke="#2B2B2B" stroke-width="2"/>
    <line x1="700" y1="416" x2="700" y2="534" stroke="#2B2B2B" stroke-width="2"/>
    <path d="M704 426 C716 456 734 474 760 486 C790 498 830 506 868 510" fill="none" stroke="#3E5C7A" stroke-width="3.5"/>
    <path d="M704 428 C716 458 734 476 760 488 C790 504 830 518 868 524" fill="none" stroke="#D49A2A" stroke-width="3" stroke-dasharray="7 4"/>
    <text x="786" y="554" text-anchor="middle" font-size="14" fill="#4B5563">frequency</text>
    <text x="733" y="524" text-anchor="middle" font-size="14" font-weight="600" fill="#8A5A0E">low freq.</text>
    <text transform="translate(688 475) rotate(-90)" text-anchor="middle" font-size="14" fill="#4B5563">power</text>
    <line x1="700" y1="576" x2="724" y2="576" stroke="#3E5C7A" stroke-width="3.5"/><text x="730" y="581" font-size="14" fill="#22364C">ECoG</text>
    <line x1="782" y1="576" x2="806" y2="576" stroke="#D49A2A" stroke-width="3" stroke-dasharray="7 4"/><text x="812" y="581" font-size="14" fill="#8A5A0E">AICP</text>
  </g>
  <g transform="translate(896 416)" font-size="16" fill="#1F2937">
    <g fill="none" stroke="#C98A1E" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 6 l6 6 l11 -13"/><path d="M0 62 l6 6 l11 -13"/><path d="M0 118 l6 6 l11 -13"/>
    </g>
    <text x="26" y="12">Low-frequency quality</text>
    <text x="26" y="31" font-size="14" fill="#4B5563">comparable to implanted ECoG</text>
    <text x="26" y="68">Higher evoked-potential SNR</text>
    <text x="26" y="87" font-size="14" fill="#4B5563">significant improvement</text>
    <text x="26" y="124">No electrode in the brain</text>
    <text x="26" y="143" font-size="14" fill="#4B5563">non-implantation approach</text>
  </g>

  <path d="M730 600 L730 624" stroke="#C98A1E" stroke-width="6" marker-end="url(#aa)"/>

  <!-- ===== APPLICATIONS ===== -->
  <rect x="664" y="646" width="508" height="134" rx="18" fill="#F2F5F9" stroke="#5B7FA3" stroke-width="2.5"/>
  <rect x="818" y="630" width="200" height="36" rx="8" fill="#3E5C7A"/>
  <text x="918" y="655" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="1.5" fill="#FFFFFF">APPLICATIONS</text>
  <!-- neurophysiology -->
  <g transform="translate(756 718) scale(1.1)"><use href="#neuron"/></g>
  <text x="756" y="764" text-anchor="middle" font-size="15" fill="#374151">neurophysiology</text>
  <!-- clinical research -->
  <g transform="translate(900 680)">
    <rect x="0" y="8" width="40" height="52" rx="6" fill="#FFFFFF" stroke="#5B7FA3" stroke-width="2.4"/>
    <rect x="12" y="2" width="16" height="10" rx="3" fill="#5B7FA3"/>
    <path d="M20 22 L20 46 M8 34 L32 34" stroke="#D49A2A" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="920" y="764" text-anchor="middle" font-size="15" fill="#374151">clinical research</text>
  <!-- BCI -->
  <g transform="translate(1046 680)">
    <rect x="18" y="4" width="64" height="44" rx="5" fill="#FFFFFF" stroke="#3E5C7A" stroke-width="2.6"/>
    <path d="M26 30 l8 -8 l8 12 l8 -16 l8 12 l8 -6 l8 4" fill="none" stroke="#D49A2A" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="42" y="48" width="16" height="8" fill="#3E5C7A"/><rect x="32" y="56" width="36" height="5" rx="2" fill="#3E5C7A"/>
  </g>
  <text x="1096" y="764" text-anchor="middle" font-size="15" fill="#374151">BCI</text>
</svg>
