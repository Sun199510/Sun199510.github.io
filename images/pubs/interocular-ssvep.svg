    <g fill="none" stroke="#B88AAA" stroke-width="2.8" stroke-linecap="round">
      <path d="M42 50 C58 36 74 44 72 60 C70 78 92 82 102 66"/><path d="M112 28 C108 46 126 54 140 44 C154 34 170 46 164 62"/>
      <path d="M38 92 C56 86 66 100 82 96 C100 92 108 104 126 100"/><path d="M140 84 C152 76 170 84 178 98"/>
