  <text x="482" y="236" text-anchor="middle" font-size="15" fill="#4B5563">eyes contribute unequally</text>

  <path d="M574 146 L622 146" stroke="#2B2B2B" stroke-width="2.4" marker-end="url(#ak)"/>

  <!-- 调节滑块：按双眼差异优化 -->
  <g>
    <rect x="640" y="86" width="160" height="116" rx="10" fill="#FFFFFF" stroke="#D3C7D2" stroke-width="2"/>
