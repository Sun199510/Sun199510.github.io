  <rect x="1" y="1" width="1198" height="798" fill="none" stroke="#2B2B2B" stroke-width="2"/>

  <!-- ============ 1 前提 ============ -->
  <text x="86" y="42" font-size="25" fill="#1F2937">The two eyes do not contribute equally</text>

  <!-- 正面人脸 -->
  <g transform="translate(200 146)">
