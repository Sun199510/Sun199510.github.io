      <rect x="92" y="423" width="26" height="26" rx="4"/><rect x="123" y="423" width="26" height="26" rx="4"/><rect x="154" y="423" width="26" height="26" rx="4"/><rect x="185" y="423" width="26" height="26" rx="4"/><rect x="216" y="423" width="26" height="26" rx="4"/><rect x="247" y="423" width="26" height="26" rx="4"/><rect x="278" y="423" width="26" height="26" rx="4"/><rect x="309" y="423" width="26" height="26" rx="4"/>
