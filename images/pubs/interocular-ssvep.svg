      <text x="105" y="410">Q</text><text x="136" y="410">R</text><text x="167" y="410" fill="#FFFFFF">S</text><text x="198" y="410">T</text><text x="229" y="410">U</text><text x="260" y="410">V</text><text x="291" y="410">W</text><text x="322" y="410">X</text>
