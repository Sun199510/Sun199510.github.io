  <path d="M272 120 C318 120 344 132 384 136" fill="none" stroke="#7A4470" stroke-width="10" stroke-linecap="round" marker-end="url(#mp)"/>
  <path d="M272 168 C318 168 344 156 386 152" fill="none" stroke="#2F7F7A" stroke-width="4" stroke-linecap="round" marker-end="url(#mt)"/>
