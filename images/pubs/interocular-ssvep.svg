    <text x="150" y="712" font-size="24" font-weight="600" fill="#1F2937">bits/min</text>
    <text x="2" y="746" font-size="18" font-weight="600" fill="#1F2937">online information transfer rate</text>
    <text x="2" y="770" font-size="15" fill="#4B5563">40-target dual-frequency speller</text>
  </g>

  <line x1="600" y1="566" x2="600" y2="782" stroke="#CFC5D0" stroke-width="2"/>

  <text x="640" y="586" font-size="23" fill="#1F2937">Implication</text>
  <line x1="640" y1="598" x2="1170" y2="598" stroke="#2B2B2B" stroke-width="1.6"/>
  <g transform="translate(650 630)" font-size="17" fill="#1F2937">
