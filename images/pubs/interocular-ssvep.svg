    <text x="103" y="153" text-anchor="middle" font-size="14" fill="#6B7280">frequency</text>
  </g>
  <text x="752" y="522" text-anchor="middle" font-size="15" fill="#4B5563">dual-frequency SSVEP</text>

  <path d="M862 410 L910 410" stroke="#2B2B2B" stroke-width="2.4" marker-end="url(#ak)"/>

  <!-- 在线拼写输出 -->
  <g transform="translate(922 340)">
    <rect x="0" y="0" width="236" height="140" rx="10" fill="#FFFFFF" stroke="#3F3A4A" stroke-width="3"/>
    <rect x="14" y="14" width="96" height="26" rx="13" fill="#E3F1EF"/>
    <text x="62" y="32" text-anchor="middle" font-size="14" font-weight="600" fill="#2F7F7A">online</text>
    <rect x="14" y="58" width="208" height="54" rx="6" fill="#F6F3F6" stroke="#D3C7D2" stroke-width="2"/>
    <text x="28" y="95" font-size="28" font-weight="700" letter-spacing="3" fill="#4E4560">SSVE<tspan fill="#7A4470">P</tspan></text>
    <line x1="144" y1="70" x2="144" y2="100" stroke="#7A4470" stroke-width="3"/>
  </g>
  <text x="1040" y="522" text-anchor="middle" font-size="15" fill="#4B5563">real-time spelling</text>

  <!-- ============ 3 结果 ============ -->
  <text x="86" y="586" font-size="23" fill="#1F2937">High online speed</text>
  <line x1="86" y1="598" x2="560" y2="598" stroke="#2B2B2B" stroke-width="1.6"/>
