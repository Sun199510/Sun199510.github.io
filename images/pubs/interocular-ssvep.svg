    <circle cx="716" cy="168" r="10" fill="#2F7F7A" stroke="#FFFFFF" stroke-width="3"/>
  </g>
  <text x="720" y="236" text-anchor="middle" font-size="15" fill="#4B5563">optimized dual-frequency coding</text>

  <path d="M818 146 L866 146" stroke="#2B2B2B" stroke-width="2.4" marker-end="url(#ak)"/>

  <!-- 双频对 -->
  <g>
    <rect x="880" y="82" width="276" height="124" rx="10" fill="#FFFFFF" stroke="#D3C7D2" stroke-width="2"/>
    <use href="#eyeP" x="908" y="116"/>
    <use href="#eyeT" x="908" y="172"/>
    <path d="M932 116 q5 -12 10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0" fill="none" stroke="#7A4470" stroke-width="2.8"/>
