    <text x="28" y="32" font-size="15" fill="#4B5563">coding adapted to each eye</text>
    <text x="28" y="70">Faster dual-frequency spelling</text>
    <text x="28" y="90" font-size="15" fill="#4B5563">40 targets, online use</text>
    <text x="28" y="128">May inform other binocular designs</text>
    <text x="28" y="148" font-size="15" fill="#4B5563">for dual-frequency SSVEP BCIs</text>
  </g>
