    <text x="1114" y="122" font-size="19" font-weight="700" fill="#7A4470">f₁</text>
    <text x="1114" y="178" font-size="19" font-weight="700" fill="#2F7F7A">f₂</text>
  </g>
  <text x="1018" y="236" text-anchor="middle" font-size="15" fill="#4B5563">a frequency pair per target</text>

  <!-- ============ 2 系统 ============ -->
  <text x="86" y="292" font-size="25" fill="#1F2937">40-target dual-frequency SSVEP speller</text>

