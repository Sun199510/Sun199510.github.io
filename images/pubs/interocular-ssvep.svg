  <text x="502" y="522" text-anchor="middle" font-size="15" fill="#4B5563">EEG recording</text>

  <path d="M592 410 L640 410" stroke="#2B2B2B" stroke-width="2.4" marker-end="url(#ak)"/>

  <!-- 双频频谱 -->
