<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="'Segoe UI', Arial, Helvetica, sans-serif">
  <defs>
    <symbol id="person" viewBox="-22 -50 44 76" overflow="visible">
      <circle cx="0" cy="-33" r="13"/>
      <path d="M-19 26 L-19 -4 Q-19 -17 -6 -17 L6 -17 Q19 -17 19 -4 L19 26 Z"/>
    </symbol>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBE3D6"/><stop offset="1" stop-color="#EFC4AE"/></linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4FA39C"/><stop offset="1" stop-color="#2F7F7A"/></linearGradient>
    <linearGradient id="brain" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4E4EE"/><stop offset="1" stop-color="#E6CADB"/></linearGradient>
    <marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2B2B2B"/></marker>
    <marker id="mp" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="2.6" markerHeight="2.6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7A4470"/></marker>
    <marker id="mt" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2F7F7A"/></marker>
    <g id="eyeP"><ellipse rx="12" ry="8" fill="#FFFFFF" stroke="#7A4470" stroke-width="2.6"/><circle r="4.5" fill="#7A4470"/></g>
    <g id="eyeT"><ellipse rx="12" ry="8" fill="#FFFFFF" stroke="#2F7F7A" stroke-width="2.6"/><circle r="4.5" fill="#2F7F7A"/></g>
  </defs>

  <rect width="1200" height="800" fill="#FFFFFF"/>

  <!-- ============ 色带 ============ -->
  <rect x="0" y="0" width="46" height="250" fill="#7A4470"/>
  <rect x="0" y="250" width="46" height="290" fill="#2F7F7A"/>
  <rect x="0" y="540" width="46" height="260" fill="#4E4560"/>
  <g fill="#FFFFFF" font-size="21" font-weight="600" text-anchor="middle">
    <text transform="translate(31 125) rotate(-90)">Premise</text>
    <text transform="translate(31 395) rotate(-90)">System</text>
    <text transform="translate(31 670) rotate(-90)">Outcome</text>
  </g>
  <rect x="46" y="0" width="1154" height="250" fill="#F6F3F6"/>
  <rect x="46" y="540" width="1154" height="260" fill="#F6F3F6"/>
