  <text x="213" y="522" text-anchor="middle" font-size="15" fill="#4B5563">40 targets, each a frequency pair</text>

  <path d="M356 410 L410 410" stroke="#2B2B2B" stroke-width="2.4" marker-end="url(#ak)"/>

